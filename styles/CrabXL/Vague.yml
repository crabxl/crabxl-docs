# STE: use words with one clear meaning. Do not use words that only add emphasis.
extends: existence
message: "Remove or replace '%s'. It adds no clear meaning."
level: warning
ignorecase: true
tokens:
  - simply
  - just
  - easily
  - obviously
  - basically
  - actually
  - really
  - very
  - etc
  - canonical
  - seamless
  - seamlessly
  - powerful
  - robust
  - effortless
  - effortlessly
  - blazing
  - welcome
  - thank you
