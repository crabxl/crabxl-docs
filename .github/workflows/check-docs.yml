# Reusable check for the docs/ folder of a source repository.
#
# Use it in a source repository:
#
#   jobs:
#     docs:
#       uses: crabxl/crabxl-docs/.github/workflows/check-docs.yml@main
name: Check documentation

on:
  workflow_call:
    inputs:
      path:
        description: Documentation folder in the calling repository
        type: string
        default: docs

permissions:
  contents: read

env:
  VALE_VERSION: 3.25.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: crabxl/crabxl-docs
          path: .crabxl-docs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the content specification
        run: node .crabxl-docs/scripts/check-content.mjs "${{ inputs.path }}"
      - name: Install Vale
        run: |
          curl -sSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check the writing rules
        run: vale --config .crabxl-docs/.vale.ini "${{ inputs.path }}"
