name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Source repositories send this event when their docs/ folder changes.
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  VALE_VERSION: 3.25.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch documentation from the source repositories
        run: npm run fetch
      - name: Check the content specification
        run: npm run check
      - name: Install Vale
        run: |
          curl -sSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check the writing rules
        run: vale content/docs
      - name: Build the site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://crabxl-docs.pages.dev' }}
      - name: Check the Cloudflare configuration
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. The site is built but not deployed."
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.152.0
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'crabxl-docs' }}
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
            --commit-dirty=true
